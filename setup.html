<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurgency Sandstorm Server Manager - Setup</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f1117; color:#e2e4ea; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .setup { max-width:550px; width:100%; padding:32px; background:#1a1d27; border:1px solid #2e3345; border-radius:12px; }
    h1 { font-size:22px; color:#c8915e; margin-bottom:4px; }
    p.sub { font-size:13px; color:#8b8fa3; margin-bottom:24px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.6px; color:#8b8fa3; margin-bottom:4px; }
    .field input, .field select { width:100%; padding:10px 14px; border:1px solid #2e3345; border-radius:6px; background:#0f1117; color:#e2e4ea; font-size:13px; outline:none; }
    .field input:focus, .field select:focus { border-color:#c8915e; }
    .field .hint { font-size:10px; color:#8b8fa3; margin-top:3px; }
    .field .detected { font-size:11px; color:#4ade80; margin-top:3px; }
    .btn { padding:12px 24px; border:none; border-radius:6px; background:#c8915e; color:#0f1117; font-size:14px; font-weight:600; cursor:pointer; width:100%; margin-top:8px; }
    .btn:hover { background:#d9a76e; }
    .divider { border-top:1px solid #2e3345; margin:20px 0; }
    .optional { color:#8b8fa3; font-size:11px; font-weight:normal; }
  </style>
</head>
<body>
<div class="setup">
  <h1>Insurgency Sandstorm Server Manager</h1>
  <p class="sub">Welcome! Let's configure your server manager.</p>

  <div class="field">
    <label>Language</label>
    <select id="s-lang"><option value="en">English</option><option value="da">Dansk</option></select>
  </div>

  <div class="field">
    <label>Steam Directory</label>
    <input type="text" id="s-steam" placeholder="C:\Program Files (x86)\Steam">
    <div class="detected" id="s-steam-det"></div>
  </div>

  <div class="field">
    <label>Dedicated Server Directory</label>
    <input type="text" id="s-server" placeholder="Auto-detected from Steam">
    <div class="detected" id="s-server-det"></div>
  </div>

  <div class="field">
    <label>Game Client Directory</label>
    <input type="text" id="s-game" placeholder="Auto-detected from Steam">
    <div class="detected" id="s-game-det"></div>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>GSLT Token <span class="optional">(optional - for Steam integration & XP rewards)</span></label>
    <input type="text" id="s-gslt" placeholder="Get from steamcommunity.com/dev/managegameservers">
    <div class="hint">App ID: 581320. Required for player name display and XP rewards.</div>
  </div>

  <div class="field">
    <label>OpenAI API Key <span class="optional">(optional - for AI voice assistant)</span></label>
    <input type="password" id="s-openai" placeholder="sk-...">
  </div>

  <div class="field">
    <label>Server Port</label>
    <input type="number" id="s-port" value="27102">
  </div>

  <button class="btn" onclick="saveSetup()">Save & Start</button>
</div>

<script>
async function loadCurrent() {
  try {
    const r = await fetch('/api/app-config');
    const d = await r.json();
    // Also load full config via setup detection
    const r2 = await fetch('/api/setup-detect');
  } catch {}
  // Auto-detect
  try {
    const r = await fetch('/api/app-config');
    const cfg = await r.json();
    if (cfg.serverDir) document.getElementById('s-server-det').textContent = 'Auto-detected';
    if (cfg.gameDir) document.getElementById('s-game-det').textContent = 'Auto-detected';
  } catch {}
}

async function saveSetup() {
  const body = {
    language: document.getElementById('s-lang').value,
    port: parseInt(document.getElementById('s-port').value) || 27102,
    gsltToken: document.getElementById('s-gslt').value.trim(),
    openaiKey: document.getElementById('s-openai').value.trim(),
  };
  const steamDir = document.getElementById('s-steam').value.trim();
  if (steamDir) body.steamDir = steamDir;
  const serverDir = document.getElementById('s-server').value.trim();
  if (serverDir) body.serverDir = serverDir;
  const gameDir = document.getElementById('s-game').value.trim();
  if (gameDir) body.gameDir = gameDir;

  try {
    const r = await fetch('/api/setup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (d.ok) window.location.href = '/';
  } catch (e) { alert('Error: ' + e.message); }
}

loadCurrent();
</script>
</body>
</html>
